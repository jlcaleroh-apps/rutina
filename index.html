<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mi Rutina">
<meta name="theme-color" content="#fff7ec">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="application-name" content="Mi Rutina">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>Mi Rutina</title>
<style>
:root{
  --bg1:#fff7ec; --bg2:#e9f6ff; --ink:#2b2d42; --muted:#6b7089;
  --card:#ffffff; --line:#e7e9f2; --accent:#4f7cff; --ok:#2fb55e; --danger:#e5484d;
  --radius:28px; --shadow:0 8px 24px rgba(40,50,90,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{
  margin:0;height:100vh;height:100dvh;overflow:hidden;display:flex;
  font-family: ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,sans-serif;
  color:var(--ink);
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  -webkit-user-select:none;user-select:none;
  touch-action:manipulation;
  overscroll-behavior:none;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
input,textarea,select{font:inherit;color:var(--ink);-webkit-user-select:text;user-select:text}

.app{flex:1;min-height:0;width:100%;max-width:1280px;margin:0 auto;padding:14px 18px 18px;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:12px;margin-bottom:14px;flex:none}
header h1{font-size:clamp(22px,3.4vw,34px);margin:0;flex:1;line-height:1.1;min-width:0}
.who{background:none;padding:6px 12px 6px 0;border-radius:18px;font-weight:800;text-align:left;display:inline-flex;align-items:center;gap:8px;max-width:100%}
.who #hello{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.who .chev{font-size:.55em;color:var(--muted);flex:none}
.who:active{background:rgba(255,255,255,.7)}
.badge{background:var(--card);border-radius:999px;padding:8px 18px;font-size:clamp(20px,3vw,28px);box-shadow:var(--shadow);white-space:nowrap;letter-spacing:2px}
.iconbtn{width:56px;height:56px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:26px;display:grid;place-items:center;flex:none}
.iconbtn:active{transform:scale(.94)}

/* Dos paneles simétricos: mismo ancho y mismo alto */
.layout{flex:1;min-height:0;display:grid;gap:18px;grid-template-columns:1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr)}
@media (orientation:landscape){ .layout{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:minmax(0,1fr)} }
.panel{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;min-height:0;overflow:hidden}

/* RELOJ */
.dialarea{position:relative;flex:1;min-height:0}
.dialarea svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.adultpill{align-self:center;margin-top:8px;background:#f1f2f9;color:var(--muted);font-weight:700;font-size:14px;padding:11px 18px;border-radius:999px;font-variant-numeric:tabular-nums}
.adultpill:active{background:#e4e7f4}
.controls{display:flex;justify-content:center;margin-top:10px;flex:none}
.btn{padding:16px 26px;border-radius:22px;font-weight:800;font-size:clamp(18px,2.6vw,24px);background:#eef1fb;box-shadow:0 3px 0 #d6dbee}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #d6dbee}
.btn:disabled{opacity:.4}
.btn.primary{background:var(--accent);color:#fff;box-shadow:0 3px 0 #3558c9}
.btn.go{background:var(--ok);color:#fff;box-shadow:0 3px 0 #1f8a45;padding:16px 44px;font-size:clamp(22px,3.2vw,30px)}
.btn.small{padding:10px 16px;font-size:16px;border-radius:16px}
.btn.danger{background:#fde8e8;color:var(--danger);box-shadow:0 3px 0 #f3c4c6}

/* LISTA */
.progress{height:14px;background:#e6e9f5;border-radius:99px;overflow:hidden;margin:2px 0 14px;flex:none}
.progress>div{height:100%;background:linear-gradient(90deg,#ffb703,#2fb55e);width:0;transition:width .4s}
.list{scroll-padding:10px 0;flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:10px;padding:4px}
.item{display:flex;flex-wrap:wrap;align-items:center;gap:14px;padding:12px 14px;border-radius:24px;background:#f6f7fc;border:3px solid transparent;cursor:pointer;transition:background .2s,padding .2s;flex:none}
.item .ic{font-size:clamp(32px,5vw,46px);width:58px;text-align:center}
.item .tx{flex:1;min-width:0}
.item .tx b{display:block;font-size:clamp(18px,2.7vw,25px);line-height:1.15}
.item .tx small{color:var(--muted);font-weight:800;font-size:clamp(14px,2vw,18px)}
.box{width:clamp(52px,7vw,68px);height:clamp(52px,7vw,68px);border-radius:20px;border:4px solid #c9cde0;background:#fff;display:grid;place-items:center;font-size:clamp(30px,5vw,44px);color:transparent;flex:none;transition:all .15s}
.item.done .box{background:var(--ok);border-color:var(--ok);color:#fff}
.item.cur{background:#f0f6ff;border-color:var(--c);box-shadow:0 0 0 4px rgba(120,130,170,.18);padding:18px 16px}
@supports (background:color-mix(in srgb,red 10%,white)){
  .item.cur{background:color-mix(in srgb,var(--c) 12%,#fff);box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 22%,transparent)}
}
.item.cur .ic{font-size:clamp(56px,9vw,88px);width:auto;min-width:92px}
.item.cur .tx b{font-size:clamp(24px,4vw,38px)}
.item.cur .tx small{font-size:clamp(16px,2.4vw,22px)}
.item.cur .box{width:clamp(64px,9vw,84px);height:clamp(64px,9vw,84px)}
.more{flex-basis:100%;padding-left:8px}
.nextup{flex-basis:100%;display:flex;align-items:center;gap:10px;margin-top:2px;padding:10px 14px;border-radius:18px;background:rgba(255,255,255,.75);color:var(--muted);font-weight:800;font-size:clamp(16px,2.3vw,21px);transition:background .4s,color .4s,box-shadow .4s}
.nextup>span{white-space:nowrap;flex:none}
.nextup i{font-style:normal;font-size:1.4em;line-height:1;flex:none}
.nextup b{flex:1;color:var(--ink);font-weight:900;min-width:0;line-height:1.2}
.nextup.soon{background:#fff4d6;color:#8a5a00;box-shadow:0 0 0 3px #ffd166;animation:soonPulse 2s ease-in-out infinite}
@keyframes soonPulse{50%{box-shadow:0 0 0 6px rgba(255,209,102,.45)}}
@media (prefers-reduced-motion:reduce){.nextup.soon{animation:none}}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{background:#fff;color:var(--ink);border-radius:20px;padding:8px 16px;font-weight:900;font-size:clamp(22px,3.4vw,34px);display:flex;align-items:center;gap:10px;box-shadow:0 2px 6px rgba(40,50,90,.12)}
.chip i{font-style:normal;font-size:1.25em}
.linkbtn{display:inline-block;margin-top:12px;background:var(--c);color:#fff;text-decoration:none;font-weight:900;padding:12px 22px;border-radius:18px;font-size:20px}
.chips + .linkbtn{margin-top:14px}
.item.done:not(.cur){padding:6px 14px;opacity:.6}
.item.done:not(.cur) .ic{font-size:26px;width:40px}
.item.done:not(.cur) .tx b{font-size:clamp(15px,2.2vw,19px);text-decoration:line-through}
.item.done:not(.cur) .tx small{display:none}
.item.done:not(.cur) .box{width:40px;height:40px;font-size:24px;border-radius:14px}
.flash{animation:flash .9s ease}
@keyframes flash{0%{transform:scale(.97)}40%{transform:scale(1.02)}100%{transform:scale(1)}}

/* MODALES */
.overlay{position:fixed;inset:0;background:rgba(30,35,70,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.overlay.show{display:flex}
#userOv{z-index:52}
#pinOv{z-index:55}
#helpOv{z-index:54}
#obOv{z-index:53;background:linear-gradient(160deg,var(--bg1),var(--bg2))}
.ob{text-align:center}
.ob .step{color:var(--muted);font-weight:800;font-size:14px;letter-spacing:1px;margin:14px 0 4px}
.ob .hero{font-size:64px;line-height:1;margin:8px 0}
.ob h3{font-size:clamp(24px,4vw,32px);margin:6px 0 8px}
.ob p{color:var(--muted);font-weight:700;font-size:17px;margin:0 0 16px;line-height:1.4}
.ob input[type=text]{width:100%;border:3px solid var(--line);border-radius:18px;padding:16px;font-size:24px;font-weight:800;text-align:center;background:#fbfbfe}
.ob input[type=text]:focus{outline:none;border-color:var(--accent)}
.ob .opts{display:flex;flex-direction:column;gap:12px;text-align:left}
.ob .opt{display:flex;gap:14px;align-items:center;padding:16px;border-radius:22px;background:#f6f7fc;border:4px solid transparent;text-align:left}
.ob .opt.on{border-color:var(--accent);background:#eef3ff}
.ob .opt i{font-style:normal;font-size:40px;flex:none}
.ob .opt b{display:block;font-size:19px}
.ob .opt small{color:var(--muted);font-weight:700;font-size:15px}
.ob .tips{list-style:none;padding:0;margin:0 0 16px;display:flex;flex-direction:column;gap:8px;text-align:left}
.ob .tips li{background:#f6f7fc;border-radius:16px;padding:10px 14px;font-weight:700;font-size:16px}
.ob .nav{display:flex;gap:10px;justify-content:center;margin-top:18px;flex-wrap:wrap}
.ob .pdots{display:flex;gap:8px;justify-content:center;margin-top:16px}
.ob .pdots span{width:10px;height:10px;border-radius:50%;background:#dde1f0}
.ob .pdots span.on{background:var(--accent);width:26px;border-radius:99px}
.help{font-size:17px;line-height:1.5;-webkit-user-select:text;user-select:text}
.help h4{font-size:19px;margin:18px 0 8px}
.help .lead{font-size:18px;color:var(--muted);font-weight:700;margin:0 0 6px}
.help ul,.help ol{margin:0;padding-left:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.help li{background:#f6f7fc;border-radius:16px;padding:10px 14px;display:flex;gap:12px;align-items:flex-start}
.help li>i{font-style:normal;font-size:26px;line-height:1.1;flex:none;width:32px;text-align:center}
.help li b{display:block}
.help .note{margin-top:16px;font-size:14px;color:var(--muted);font-weight:700}
.linky{background:none;color:var(--accent);font-weight:800;font-size:16px;text-decoration:underline;padding:6px}
.modal{background:#fff;border-radius:30px;width:min(94vw,520px);max-height:92vh;overflow:auto;padding:22px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.modal.wide{width:min(96vw,860px)}
.modal h3{margin:0 0 12px;font-size:24px}
.mhead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
.mhead h3{flex:1;margin:0}
.dots{display:flex;gap:14px;justify-content:center;margin:10px 0 18px}
.dots span{width:20px;height:20px;border-radius:50%;background:#dde1f0}
.dots span.on{background:var(--accent)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.keys button{height:68px;border-radius:20px;background:#eef1fb;font-size:28px;font-weight:800}
.keys button:active{background:#dfe5fb}
.shake{animation:shake .4s}
@keyframes shake{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-8px)}80%{transform:translateX(8px)}}

/* Selector de usuario */
.users{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-top:14px}
.userbtn{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 10px;border-radius:26px;background:#f6f7fc;border:4px solid transparent;font-weight:900;font-size:clamp(20px,3vw,28px);min-width:0}
.userbtn span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.userbtn.on{border-color:var(--accent);background:#eef3ff}
.userbtn:active{transform:scale(.97)}
.usercell{display:flex;flex-direction:column;gap:8px;min-width:0}
.usercell .userbtn{width:100%}
.rchips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.rchip{padding:9px 14px;font-size:14px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.addcell{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 10px;border-radius:26px;background:#fff;border:4px dashed #cfd5ea;font-weight:900;font-size:clamp(18px,2.6vw,22px);color:var(--accent);min-height:100%}
.addcell .plus{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:52px;background:#eef3ff;color:var(--accent)}
.addcell:active{transform:scale(.97)}
.addform{display:flex;flex-direction:column;gap:8px;padding:14px;border-radius:26px;background:#f6f7fc;border:4px solid var(--accent)}
.addform input{border:2px solid var(--line);border-radius:14px;padding:12px;font-size:20px;font-weight:800;text-align:center;width:100%;background:#fff}
.addform .btnrow{justify-content:center;margin-top:0}
.avatar{width:96px;height:96px;border-radius:50%;display:grid;place-items:center;font-size:48px;color:#fff;font-weight:900}
.langsw{display:flex;gap:8px;justify-content:center}
.langsw.left{justify-content:flex-start}
.langbtn{padding:8px 18px;border-radius:999px;background:#eef1fb;font-weight:800;font-size:16px}
.langbtn.on{background:var(--accent);color:#fff}

.sec{border-top:2px solid var(--line);padding-top:14px;margin-top:16px}
.sec h4{margin:0 0 10px;font-size:19px}
.field{display:flex;flex-direction:column;gap:4px;margin-bottom:10px}
.field label{font-size:13px;font-weight:800;color:var(--muted)}
.field input[type=text],.field input[type=number],.field input[type=password],.field input[type=url],.field textarea,.field select{
  border:2px solid var(--line);border-radius:14px;padding:11px 13px;font-size:17px;width:100%;background:#fbfbfe}
.field textarea{min-height:64px;resize:vertical}
.grid2{display:grid;grid-template-columns:90px 1fr 110px 70px;gap:10px;align-items:end}
@media (max-width:640px){.grid2{grid-template-columns:80px 1fr}}
.act{border:2px solid var(--line);border-radius:22px;padding:14px;margin-bottom:12px;background:#fcfcff}
.act .tools{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.profrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.profrow input[type=text]{flex:1;border:2px solid var(--line);border-radius:14px;padding:10px 12px;font-size:17px}
.profrow .sel{width:44px;height:44px;border-radius:50%;background:#eef1fb;font-size:20px}
.profrow .sel.on{background:var(--ok);color:#fff}
.rmeta{color:var(--muted);font-weight:700;font-size:14px;white-space:nowrap}
@media (max-width:640px){.rmeta{display:none}}
.switch{display:flex;align-items:center;gap:10px;font-weight:700;font-size:17px;margin-bottom:8px}
.switch input{width:26px;height:26px}
.total{font-weight:800;color:var(--muted);margin:6px 0}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}

/* Panel del adulto */
.apnow{font-size:22px;font-weight:900;margin:4px 0 10px}
.aptimes{display:flex;gap:12px}
.aptimes>div{flex:1;background:#f4f5fb;border-radius:18px;padding:10px 14px}
.aptimes small{display:block;color:var(--muted);font-weight:800;font-size:13px}
.aptimes b{font-size:34px;font-variant-numeric:tabular-nums}

/* Calendario */
.calnav{display:flex;align-items:center;gap:10px;margin:8px 0}
.calnav b{flex:1;text-align:center;font-size:20px;text-transform:capitalize}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.calgrid .wd{text-align:center;font-weight:800;color:var(--muted);font-size:14px}
.day{min-height:56px;border-radius:14px;background:#f6f7fc;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:26px;line-height:1}
.day small{font-size:11px;color:var(--muted);font-weight:700;margin-bottom:2px}
.day.done{background:#e3f6ea}
.day.today{outline:3px solid var(--accent)}
.calsum{text-align:center;margin-top:14px}
.calsum .fl{font-size:36px;letter-spacing:3px}
.calsum small{display:block;color:var(--muted);font-weight:700;margin-top:4px}

/* CELEBRACION */
.celebrate{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.7);backdrop-filter:blur(4px)}
.celebrate.show{display:flex}
.cbox{background:#fff;border-radius:36px;padding:32px 40px;text-align:center;box-shadow:var(--shadow);max-width:90vw}
.cbox .big{font-size:96px}
.cbox h2{font-size:clamp(28px,5vw,46px);margin:6px 0}
.cbox p{font-size:clamp(28px,5vw,44px);margin:8px 0 18px;letter-spacing:4px}
.conf{position:fixed;top:-40px;font-size:34px;z-index:61;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg);opacity:.9}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1><button class="who" id="who" data-i18n-aria="ariaWho"><span id="hello">¡Hola!</span><span class="chev">▾</span></button></h1>
    <div class="badge" id="streak">🌱</div>
    <button class="iconbtn" id="helpBtn" data-i18n-aria="ariaHelp">❓</button>
    <button class="iconbtn" id="calBtn" data-i18n-aria="ariaDays">📅</button>
    <button class="iconbtn" id="gear" data-i18n-aria="ariaSettings">⚙️</button>
  </header>

  <div class="layout">
    <section class="panel">
      <div class="dialarea"><svg id="dial" viewBox="-125 -125 250 250" data-i18n-aria="ariaTimer"></svg></div>
      <button class="adultpill" id="adultPill" data-i18n-aria="ariaAdult">Total 60:00 · Actividad 5:00</button>
      <div class="controls"><button class="btn go" id="bStart">▶ Empezar</button></div>
    </section>

    <section class="panel">
      <div class="progress"><div id="prog"></div></div>
      <div class="list" id="list"></div>
    </section>
  </div>
</div>

<!-- USUARIO (al inicio) -->
<div class="overlay" id="userOv">
  <div class="modal" style="width:min(94vw,640px)">
    <div class="langsw" id="userLang"></div>
    <h3 id="userTitle" data-i18n="u_title" style="text-align:center;font-size:clamp(26px,4vw,36px);margin-top:14px"></h3>
    <div class="users" id="userGrid"></div>
    <div style="text-align:center;margin-top:18px"><button class="btn small" id="userAdult" data-i18n="u_adult"></button></div>
    <div style="text-align:center;margin-top:8px"><button class="linky" id="userHelp" data-i18n="u_help"></button></div>
  </div>
</div>

<!-- BIENVENIDA (primera vez) -->
<div class="overlay" id="obOv">
  <div class="modal ob" style="width:min(94vw,520px)" id="obBody"></div>
</div>

<!-- AYUDA -->
<div class="overlay" id="helpOv">
  <div class="modal wide">
    <div class="mhead"><h3 data-i18n="help_title"></h3><button class="btn small primary" id="helpClose" data-i18n="help_ok"></button></div>
    <div class="help" id="helpBody"></div>
  </div>
</div>

<!-- PIN -->
<div class="overlay" id="pinOv">
  <div class="modal" style="width:min(90vw,360px)">
    <h3 style="text-align:center" data-i18n="pinTitle"></h3>
    <div class="dots" id="pinDots"><span></span><span></span><span></span><span></span></div>
    <div class="keys" id="keys"></div>
    <div style="text-align:center;margin-top:14px"><button class="btn small" id="pinCancel" data-i18n="cancel"></button></div>
  </div>
</div>

<!-- PANEL DEL ADULTO -->
<div class="overlay" id="adultOv">
  <div class="modal">
    <div class="mhead"><h3 data-i18n="adultTitle"></h3><button class="btn small primary" id="adultClose" data-i18n="closeOk"></button></div>
    <div id="adultBody"></div>
  </div>
</div>

<!-- AJUSTES -->
<div class="overlay" id="setOv">
  <div class="modal wide">
    <div class="mhead"><h3 data-i18n="settingsTitle"></h3><button class="btn primary" id="setClose" data-i18n="doneOk"></button></div>
    <div id="setBody"></div>
  </div>
</div>

<!-- CALENDARIO -->
<div class="overlay" id="calOv">
  <div class="modal" style="width:min(94vw,560px)">
    <div class="mhead"><h3 id="calTitle">⭐</h3><button class="btn small primary" id="calClose" data-i18n="closeOk"></button></div>
    <div class="calnav">
      <button class="btn small" id="calPrev" data-i18n-aria="ariaPrev">◀</button>
      <b id="calMonth"></b>

    // migración: historial de días a partir de versiones anteriores

      p.history={};
      if(p.last && p.streak){
        const d=parseDay(p.last);
        for(let i=0;i<p.streak;i++){ p.history[dayStr(d)]=1; d.setDate(d.getDate()-1); }
      }
    }
    // migración: reconocer las actividades por defecto para poder traducirlas
    p.routines.forEach(rt=>rt.acts.forEach(a=>{
      if(!a.k){
        const k=Object.keys(DEFACTS.es).find(x=>DEFACTS.es[x].name===a.name || DEFACTS.en[x].name===a.name);
        if(k) a.k=k;
      }
      if(a.k==='read' && OLD_READ.includes(a.items)) a.items='';
    }));
  });
  return r;
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
const P = () => S.profiles.find(p=>p.id===S.active) || S.profiles[0];
function rollDay(){
  S.profiles.forEach(p=>{ if(p.checks.date!==dayStr()) p.checks={date:dayStr(),done:[]}; });
}
function streakNow(p){
  const h=p.history||{}, d=new Date(); d.setHours(12,0,0,0);
  if(!h[dayStr(d)]) d.setDate(d.getDate()-1);
  let n=0; while(h[dayStr(d)]){ n++; d.setDate(d.getDate()-1); }
  return n;
}
function bestStreak(h){
  let best=0,cur=0,prev=null;
  Object.keys(h).sort().forEach(k=>{
    const d=parseDay(k);
    cur = (prev && Math.round((d-prev)/864e5)===1) ? cur+1 : 1;
    best=Math.max(best,cur); prev=d;
  });
  return best;
}
const totalSec = () => P().acts.reduce((a,x)=>a+x.min*60,0);

function applyStatic(){
  document.documentElement.lang=S.lang;
  document.title=t('title');
  document.querySelectorAll('[data-i18n]').forEach(e=>{ e.textContent=t(e.dataset.i18n); });

}
const langHTML = () => ['es','en'].map(l=>`<button class="langbtn ${S.lang===l?'on':''}" data-act="lang" data-lang="${l}">${l==='es'?'Español':'English'}</button>`).join('');
function setLang(l){
  if(l===S.lang || !I18N[l]) return;
  const old=S.lang;
  S.profiles.forEach(p=>p.routines.forEach(rt=>{
    if(rt.k==='base' && rt.name===RNAME[old]) rt.name=RNAME[l];
    rt.acts.forEach(a=>{
      if(!a.k) return;
      const o=DEFACTS[old][a.k], n=DEFACTS[l][a.k]; if(!o||!n) return;
      if(a.name===o.name) a.name=n.name;       // solo se traducen los textos que no se editaron

/* ---------- temporizador ---------- */
let running=false, base=0, startTs=0, lastIdx=-1, wake=null, praiseN=0;
const elapsed = () => Math.min(totalSec(), base + (running ? (Date.now()-startTs)/1000 : 0));
function setElapsed(s){ base=Math.max(0,Math.min(totalSec(),s)); startTs=Date.now(); }
function bounds(){ let c=0; return P().acts.map(a=>{const s=c; c+=a.min*60; return {s,e:c};}); }
function curIndex(){
  const el=elapsed(), b=bounds();
  for(let i=0;i<b.length;i++) if(el<b[i].e) return i;
  return b.length; // terminó
}
function shift(sec){ setElapsed(elapsed()+sec); }
function prevAct(){
  const idx=curIndex(), b=bounds();
  if(idx>=b.length) setElapsed(b[b.length-1].s);
  else if(idx===0 || elapsed()-b[idx].s>3) setElapsed(b[idx].s);
  else setElapsed(b[idx-1].s);
}
function nextAct(){ const i=curIndex(), b=bounds(); if(i<b.length) setElapsed(b[i].e); }
function releaseWake(){ if(wake){ try{wake.release()}catch(e){} wake=null; } }
function resetClock(){ running=false; base=0; releaseWake(); }

/* ---------- sonido y voz ---------- */
let actx=null;
function getCtx(){
  actx = actx || new (window.AudioContext||window.webkitAudioContext)();
  if(actx.state!=='running') actx.resume();
  return actx;
}
function unlockAudio(){ try{ getCtx(); }catch(e){} } // Safari solo permite audio si se activa durante un toque
document.addEventListener('pointerdown',unlockAudio);
function chime(){
  if(!S.sound) return;
  try{
    getCtx();
    [660,880,1100].forEach((f,i)=>{
      const o=actx.createOscillator(), g=actx.createGain();
      o.type='sine'; o.frequency.value=f; o.connect(g); g.connect(actx.destination);
      const tt=actx.currentTime+i*0.18;
      g.gain.setValueAtTime(0,tt); g.gain.linearRampToValueAtTime(.25,tt+.03);
      g.gain.exponentialRampToValueAtTime(.001,tt+.35);
      o.start(tt); o.stop(tt+.4);
    });
  }catch(e){}
}
const hasTTS = 'speechSynthesis' in window && 'SpeechSynthesisUtterance' in window;
let voices=[];
function loadVoices(){
  if(!hasTTS) return;
  const re=new RegExp('^'+S.lang,'i');
  voices=speechSynthesis.getVoices().filter(v=>re.test(v.lang));
}
if(hasTTS){ loadVoices(); speechSynthesis.onvoiceschanged=loadVoices; }
function pickVoice(){
  const id=S.voiceBy[S.lang];
  const pref = S.lang==='en' ? [/en[-_]US/i,/en[-_]GB/i] : [/es[-_]MX/i,/es[-_]US/i];
  return voices.find(v=>v.voiceURI===id)
    || pref.map(re=>voices.find(v=>re.test(v.lang))).find(Boolean)
    || voices[0];
}
function say(text, opts){
  opts=opts||{};
  if(!hasTTS || (!S.voiceOn && !opts.force)) return;
  const go=()=>{
    try{
      if(opts.polite && speechSynthesis.speaking) return;
      if(speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text), v=pickVoice();
      if(v){ u.voice=v; u.lang=v.lang; } else u.lang = S.lang==='en' ? 'en-US' : 'es-MX';
      u.rate=.88; u.pitch=1.05;
      speechSynthesis.speak(u);
    }catch(e){}
  };
  if(opts.delay) setTimeout(go,opts.delay); else go();
}
function announceActivity(idx){
  const a=P().acts[idx]; if(!a) return;
  chime();
  const pr=t('v_praise');
  say(t('v_next',{p:pr[praiseN++%pr.length],a:a.name}),{delay:700});
}
async function lockScreen(){ try{ if(navigator.wakeLock) wake=await navigator.wakeLock.request('screen'); }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(running && document.visibilityState==='visible') lockScreen(); });

/* ---------- reloj SVG ---------- */
const R=102; // radio del sector de color
const pt = (deg,r) => { const a=deg*Math.PI/180; return [(-r*Math.sin(a)).toFixed(2),(-r*Math.cos(a)).toFixed(2)]; }; // grados antihorarios desde las 12
function buildDial(){
  let h='<circle r="121" fill="#fff" stroke="#e3e6f3" stroke-width="3"/>';
  for(let k=0;k<12;k++){ // marcas cada 5 minutos, sin números
    const [x1,y1]=pt(k*30,108),[x2,y2]=pt(k*30,116);
    h+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="#9aa0bd" stroke-width="3" stroke-linecap="round"/>`;
  }
  h+='<path id="wedge" d="" fill="#ff5a4f" opacity=".92"/>';
  h+=`<line id="hand" x1="0" y1="0" x2="0" y2="-${R}" stroke="#fff" stroke-width="2.5" stroke-linecap="round" opacity=".9"/>`;
  h+='<circle r="32" fill="#fff" stroke="#e3e6f3" stroke-width="2"/><text id="center" y="2" text-anchor="middle" dominant-baseline="central" font-size="38"></text>';
  $('#dial').innerHTML=h;
}
function updateDial(){
  const tot=totalSec(), el=elapsed(), rem=tot-el, f=tot?rem/tot:0, idx=curIndex(), acts=P().acts;
  const col = acts[idx] ? acts[idx].color : '#2fb55e';
  const w=$('#wedge'); w.setAttribute('fill',col);
  if(f<=0.0005) w.setAttribute('d','');
  else if(f>=0.9995) w.setAttribute('d',`M0 0 m-${R} 0 a${R} ${R} 0 1 0 ${2*R} 0 a${R} ${R} 0 1 0 -${2*R} 0`);
  else{
    const ang=f*360, [x,y]=pt(ang,R);
    w.setAttribute('d',`M0 0 L0 -${R} A${R} ${R} 0 ${ang>180?1:0} 0 ${x} ${y} Z`);
  }
  const [hx,hy]=pt(f*360,R); const hand=$('#hand'); hand.setAttribute('x2',hx); hand.setAttribute('y2',hy);
  hand.style.display = (f<=0.0005||f>=0.9995)?'none':'';
  $('#center').textContent = acts[idx] ? acts[idx].icon : '🎉';
}

/* ---------- reloj numérico para el adulto ---------- */
function updateAdult(){
  const tot=totalSec(), el=elapsed(), idx=curIndex(), b=bounds(), a=P().acts[idx];
  const rem=tot-el, actRem=b[idx]?b[idx].e-el:0;
  $('#adultPill').textContent=t('pill',{a:mmss(rem),b:mmss(actRem)});
  if($('#apTotal')){
    $('#apTotal').textContent=mmss(rem); $('#apAct').textContent=mmss(actRem);
    $('#apNow').textContent = a ? a.icon+' '+a.name : t('a_done');
    $('#apToggle').textContent = running ? t('pause') : (el>0 && el<tot ? t('resume') : t('start'));
  }
}

/* ---------- vista principal ---------- */
function parseItems(txt){
  return String(txt||'').split('\n').map(l=>l.trim()).filter(Boolean).map(l=>{
    const m=l.match(/^(\p{Extended_Pictographic}[️‍\p{Extended_Pictographic}]*)\s+(.*)$/u);
    return m?{e:m[1],t:m[2]}:{e:'',t:l};
  });
}
function renderList(flash){

function renderHeader(){
  const p=P(); $('#hello').textContent=t('hello',{n:p.name});

function renderButtons(){
  const b=$('#bStart');
  if(running) b.textContent=t('pause');
  else if(elapsed()>0 && elapsed()<totalSec()) b.textContent=t('resume');
  else b.textContent=t('start');
}
function renderAll(){ buildDial(); renderHeader(); renderList(); renderButtons(); updateDial(); updateAdult(); }

function tick(force){
  rollDay();
  const idx=curIndex();
  if(idx!==lastIdx || force===true){
    const changed = lastIdx!==-1 && idx!==lastIdx;
    lastIdx=idx;
    renderList(changed);
    if(changed && running) announceActivity(idx);
  }
  if(running && elapsed()>=totalSec()){
    running=false; base=totalSec(); releaseWake(); renderButtons(); chime();
    say(t('v_done',{n:P().name}),{delay:700});
  }
  updateNext(idx);
  updateDial(); updateAdult();
}
// aviso de transición: en el último minuto de una actividad se resalta "Después" y la voz lo anuncia una vez
let soonIdx=-1;
function updateNext(idx){
  const el=$('#nextUp'); if(!el) return;
  const b=bounds()[idx], acts=P().acts;
  const left = b ? b.e - elapsed() : 0;
  const soon = running && b && (b.e-b.s)>60 && left>0 && left<=60;
  if(el.classList.contains('soon')!==soon){
    el.classList.toggle('soon',soon);
    const l=$('#nextLbl'); if(l) l.textContent=t(soon?'nx_soon':'nx_after');
  }
  if(soon && soonIdx!==idx){
    soonIdx=idx;
    const nx=acts[idx+1]; if(nx && left>50) say(t('v_soon',{a:nx.name}));
  }
  if(!soon && soonIdx===idx && left>60) soonIdx=-1;
}
setInterval(()=>tick(),200);

/* ---------- acciones ---------- */
function toggleRun(){
  if(running){ base=elapsed(); running=false; releaseWake(); }
  else{
    const fresh = elapsed()===0 || elapsed()>=totalSec();
    if(elapsed()>=totalSec()) setElapsed(0);
    startTs=Date.now(); running=true; lockScreen();
    lastIdx=curIndex();
    const a=P().acts[lastIdx];
    if(fresh && a){ renderList(); say(t('v_welcome',{n:P().name,a:a.name})); }
    else chime();
  }
  renderButtons(); tick(true);
}

    case 'reset':
      if(!confirm(t('a_resetQ'))) return;
      resetClock(); break;
    case 'settings': $('#adultOv').classList.remove('show'); openSettings(); return;
  }
  renderButtons(); tick(true);
});

/* ---------- calendario de días ---------- */
let calY=0, calM=0;
function openCal(){ const d=new Date(); calY=d.getFullYear(); calM=d.getMonth(); drawCal(); $('#calOv').classList.add('show'); }
function drawCal(){
  const p=P(), h=p.history||{};
  $('#calTitle').textContent=t('cal_title',{n:p.name});
  $('#calMonth').textContent=t('months')[calM]+' '+calY;
  const first=new Date(calY,calM,1), lead=(first.getDay()+6)%7, n=new Date(calY,calM+1,0).getDate();
  let g=t('wd').map(w=>`<div class="wd">${w}</div>`).join('');
  for(let i=0;i<lead;i++) g+='<div></div>';
  const today=dayStr(); let cnt=0;
  for(let d=1; d<=n; d++){
    const key=calY+'-'+pad(calM+1)+'-'+pad(d), done=!!h[key]; if(done) cnt++;
    g+=`<div class="day ${done?'done':''} ${key===today?'today':''}"><small>${d}</small>${done?'⭐':''}</div>`;
  }
  $('#calGrid').innerHTML=g;
  const cur=streakNow(p);
  $('#calSum').innerHTML=`<div class="fl">${flames(cur)}</div>
    <small>${t('cal_sum',{c:cur,b:bestStreak(h),m:cnt,d:cnt===1?t('day'):t('days')})}</small>`;
}
$('#calBtn').onclick=openCal;
$('#calClose').onclick=()=>$('#calOv').classList.remove('show');
$('#calPrev').onclick=()=>{ calM--; if(calM<0){calM=11;calY--;} drawCal(); };
$('#calNext').onclick=()=>{ calM++; if(calM>11){calM=0;calY++;} drawCal(); };

/* ---------- ajustes ---------- */
let dirty=false;
function openSettings(){ dirty=false; drawSettings(); $('#setOv').classList.add('show'); }
$('#setClose').onclick=()=>{
  $('#setOv').classList.remove('show');
  save();
  if(dirty) resetClock();
  renderAll(); renderButtons(); tick(true);
  if(fromUsers){ fromUsers=false; openUsers(); }
};
function routinesHTML(p){
  let h=`<div class="sec"><h4>${t('r_title',{n:esc(p.name)})}</h4>`;
  h+=p.routines.map(r=>`<div class="profrow" data-rid="${r.id}">
      <button class="sel ${r.id===p.rid?'on':''}" data-act="selrout" title="${esc(t('r_use'))}">${r.id===p.rid?'✓':'○'}</button>
      <input type="text" value="${esc(r.name)}" maxlength="30" data-act="renrout">
      <span class="rmeta">${t('r_meta',{a:r.acts.length,m:r.acts.reduce((a,x)=>a+x.min,0)})}</span>
      <button class="btn small danger" data-act="delrout">🗑</button></div>`).join('');
  h+=`<div class="profrow"><input type="text" id="newRout" placeholder="${esc(t('r_namePh'))}" maxlength="30"></div>
      <div class="btnrow"><button class="btn small primary" data-act="addrout-copy">${t('r_copy')}</button>
      <button class="btn small" data-act="addrout-base">${t('r_base')}</button></div></div>`;
  return h;
}
function drawSettings(){
  const p=P(); loadVoices();
  let h=`<div class="sec" style="border-top:0;margin-top:0"><h4>${t('s_lang')}</h4><div class="langsw left">${langHTML()}</div></div>`;
  h+=`<div class="sec"><h4>${t('s_profiles')}</h4>`;
  h+=S.profiles.map(x=>`<div class="profrow" data-pid="${x.id}">
      <button class="sel ${x.id===S.active?'on':''}" data-act="selprof" title="${esc(t('s_useProfile'))}">${x.id===S.active?'✓':'○'}</button>
      <input type="text" value="${esc(x.name)}" maxlength="24" data-act="renprof">
      <button class="btn small danger" data-act="delprof">🗑</button></div>`).join('');
  h+=`<div class="profrow"><input type="text" id="newProf" placeholder="${esc(t('s_newProfPh'))}" maxlength="24">
      <button class="btn small primary" data-act="addprof">${t('s_add')}</button></div></div>`;

  h+=routinesHTML(p);
  h+=`<div class="sec"><h4>${t('s_schedule',{r:esc(activeRoutine(p).name)})}</h4><div class="total" id="totalTxt"></div>`;
  h+=p.acts.map((a,i)=>`<div class="act" data-aid="${a.id}">
      <div class="grid2">
        <div class="field"><label>${t('f_icon')}</label><input type="text" data-f="icon" value="${esc(a.icon)}" maxlength="8"></div>
        <div class="field"><label>${t('f_name')}</label><input type="text" data-f="name" value="${esc(a.name)}" maxlength="40"></div>
        <div class="field"><label>${t('f_min')}</label><input type="number" data-f="min" value="${a.min}" min="1" max="120" inputmode="numeric"></div>
        <div class="field"><label>${t('f_color')}</label><input type="color" data-f="color" value="${esc(a.color)}" style="width:100%;height:46px;border:0;background:none"></div>
      </div>
      <div class="field"><label>${t('f_items')}</label><textarea data-f="items" placeholder="🦆">${esc(a.items)}</textarea></div>
      <div class="field"><label>${t('f_link')}</label><input type="url" data-f="link" value="${esc(a.link)}" placeholder="https://"></div>
      <div class="tools">
        <button class="btn small" data-act="up" ${i===0?'disabled':''}>▲</button>
        <button class="btn small" data-act="down" ${i===p.acts.length-1?'disabled':''}>▼</button>
        <button class="btn small danger" data-act="delact">${t('remove')}</button>
      </div></div>`).join('');
  h+=`<button class="btn small primary" data-act="addact">${t('addAct')}</button>
      <button class="btn small" data-act="restore">${t('restore')}</button></div>`;

  const sel=pickVoice();
  const vopts = voices.map(v=>`<option value="${esc(v.voiceURI)}" ${(sel&&sel.voiceURI===v.voiceURI)?'selected':''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('');
  h+=`<div class="sec"><h4>${t('s_voice')}</h4>
      <label class="switch"><input type="checkbox" id="voiceChk" ${S.voiceOn?'checked':''}> ${t('voiceChk')}</label>
      ${hasTTS && voices.length ? `<div class="field" style="max-width:420px"><label>${t('voiceLbl')}</label><select id="voiceSel">${vopts}</select></div>
        <button class="btn small" data-act="testvoice">${t('testVoice')}</button>`
        : `<div class="total">${t('noVoices')}</div>`}
      <label class="switch" style="margin-top:12px"><input type="checkbox" id="soundChk" ${S.sound?'checked':''}> ${t('soundChk')}</label></div>`;

  h+=`<div class="sec"><h4>${t('s_general')}</h4>
      <div class="total">${S.pin?t('pinOn'):t('pinOff')}</div>
      <div class="field" style="margin-top:6px;max-width:260px"><label>${t('pinLbl')}</label>
        <input type="password" id="newPin" inputmode="numeric" maxlength="4" pattern="[0-9]*" placeholder="••••"></div>
      <div class="btnrow">
        <button class="btn small" data-act="savepin">${t('savePin')}</button>
        ${S.pin?`<button class="btn small" data-act="clearpin">${t('clearPin')}</button>`:''}
        <button class="btn small danger" data-act="clearhist">${t('clearHist',{n:esc(p.name)})}</button>
        <button class="btn small danger" data-act="resetchecks">${t('resetChecks')}</button>
      </div></div>`;
  $('#setBody').innerHTML=h; updTotal();
}
function updTotal(){ const el=$('#totalTxt'); if(el){ const m=totalSec()/60; el.textContent=t('s_total',{m:m})+(m===60?t('s_totalOk'):t('s_totalAdj')); } }

$('#setBody').addEventListener('input',e=>{
  const tg=e.target, p=P();
  const ar=tg.closest('.act');
  if(ar && tg.dataset.f){
    const a=p.acts.find(x=>x.id===ar.dataset.aid); if(!a) return;
    if(tg.dataset.f==='min'){ a.min=Math.max(1,Math.min(120,parseInt(tg.value)||1)); updTotal(); }
    else a[tg.dataset.f]=tg.value;
    dirty=true; save();
  }
  if(tg.dataset.act==='renprof'){
    const x=S.profiles.find(q=>q.id===tg.closest('.profrow').dataset.pid);
    if(x){ x.name=tg.value.trim()||'Peque'; save(); }
  }
  if(tg.dataset.act==='renrout'){
    const x=p.routines.find(q=>q.id===tg.closest('.profrow').dataset.rid);
    if(x){ x.name=tg.value.trim()||x.name; save(); }
  }
});
$('#setBody').addEventListener('change',e=>{
  const tg=e.target;
  if(tg.id==='soundChk'){ S.sound=tg.checked; save(); }
  if(tg.id==='voiceChk'){ S.voiceOn=tg.checked; save(); }
  if(tg.id==='voiceSel'){ S.voiceBy[S.lang]=tg.value; save(); say(t('v_test2',{n:P().name}),{force:true}); }
});
$('#setBody').addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!b.dataset.act) return;
  const act=b.dataset.act, p=P();
  const pr=b.closest('.profrow'), ar=b.closest('.act');
  const ai = ar ? p.acts.findIndex(x=>x.id===ar.dataset.aid) : -1;
  switch(act){
    case 'lang': setLang(b.dataset.lang); return;
    case 'testvoice': say(t('v_test',{n:p.name}),{force:true}); return;
    case 'selrout': p.rid=pr.dataset.rid; dirty=true; break;
    case 'delrout':
      if(p.routines.length<2){ alert(t('al_oneRout')); return; }
      if(!confirm(t('al_delRout'))) return;
      p.routines=p.routines.filter(x=>x.id!==pr.dataset.rid);
      if(!p.routines.some(x=>x.id===p.rid)) p.rid=p.routines[0].id; dirty=true; break;
    case 'addrout-copy': case 'addrout-base':{
      const nm=$('#newRout').value.trim();
      const nr={id:uid(),name:nm||t('r_def',{n:p.routines.length+1}),acts:act==='addrout-copy'?cloneActs(p.acts):defaultActs(S.lang)};
      p.routines.push(nr); p.rid=nr.id; dirty=true; break; }
    case 'selprof': S.active=pr.dataset.pid; dirty=true; break;
    case 'delprof':
      if(S.profiles.length<2){ alert(t('al_oneProf')); return; }
      if(!confirm(t('al_delProf'))) return;
      S.profiles=S.profiles.filter(x=>x.id!==pr.dataset.pid);
      if(!S.profiles.some(x=>x.id===S.active)) S.active=S.profiles[0].id; dirty=true; break;
    case 'addprof':{
      const n=$('#newProf').value.trim(); if(!n){ $('#newProf').focus(); return; }
      const np=newProfile(n, cloneActs(p.acts), S.lang, activeRoutine(p).name); np.routines[0].k=activeRoutine(p).k;
      S.profiles.push(np); S.active=np.id; dirty=true; break; }
    case 'up': if(ai>0){ [p.acts[ai-1],p.acts[ai]]=[p.acts[ai],p.acts[ai-1]]; dirty=true; } break;
    case 'down': if(ai>=0&&ai<p.acts.length-1){ [p.acts[ai+1],p.acts[ai]]=[p.acts[ai],p.acts[ai+1]]; dirty=true; } break;
    case 'delact':
      if(p.acts.length<2){ alert(t('al_oneAct')); return; }
      if(!confirm(t('al_delAct'))) return;
      p.acts.splice(ai,1); dirty=true; break;
    case 'addact': p.acts.push({id:uid(),icon:'⭐',name:t('newAct'),min:5,color:'#6C8CFF',items:'',link:''}); dirty=true; break;
    case 'restore':
      if(!confirm(t('al_restore'))) return;
      p.acts=defaultActs(S.lang); p.checks={date:dayStr(),done:[]}; dirty=true; break;
    case 'savepin':{
      const v=$('#newPin').value;
      if(!/^\d{4}$/.test(v)){ alert(t('al_pin4')); return; }
      S.pin=v; save(); alert(t('al_pinSaved')); drawSettings(); return; }
    case 'clearpin':
      if(!confirm(t('al_pinClearQ'))) return;
      S.pin=''; save(); alert(t('al_pinCleared')); drawSettings(); return;
    case 'clearhist':
      if(!confirm(t('al_clear',{n:p.name}))) return;
      p.history={}; break;
    case 'resetchecks': p.checks={date:dayStr(),done:[]}; break;
    default: return;
  }
  save(); drawSettings();
});

/* ---------- ayuda ---------- */
function openHelp(){ $('#helpBody').innerHTML=t('help_html'); $('#helpOv').classList.add('show'); }
$('#helpBtn').onclick=openHelp;
$('#userHelp').onclick=openHelp;
$('#helpClose').onclick=()=>{ $('#helpOv').classList.remove('show'); if(!S.helpSeen){ S.helpSeen=true; save(); } };

/* ---------- bienvenida (primera vez) ---------- */
const ob={step:1,name:'',mode:'base'};
function drawOb(){
  const dots=[1,2,3].map(i=>`<span class="${i===ob.step?'on':''}"></span>`).join('');
  const st=`<div class="step">${t('ob_step',{a:ob.step,b:3})}</div>`;
  let h='';
  if(ob.step===1){
    h=`<div class="langsw">${langHTML()}</div>${st}<div class="hero">👋</div>
      <h3>${t('ob1_t')}</h3><p>${t('ob1_p')}</p>
      <input type="text" id="obName" maxlength="24" autocomplete="off" placeholder="${esc(t('ob1_ph'))}" value="${esc(ob.name)}">
      <p style="font-size:14px;margin:10px 0 0">${t('ob1_more')}</p>
      <div class="nav"><button class="btn go" data-ob="next" id="obNext" ${ob.name.trim()?'':'disabled'}>${t('ob_next')}</button></div>`;
  }else if(ob.step===2){
    const o=(m,ic,a,d)=>`<button class="opt ${ob.mode===m?'on':''}" data-ob="mode" data-m="${m}"><i>${ic}</i><span><b>${t(a)}</b><small>${t(d)}</small></span></button>`;
    h=`${st}<div class="hero">📋</div><h3>${t('ob2_t')}</h3><p>${t('ob2_p')}</p>
      <div class="opts">${o('base','⏳','ob2_a','ob2_ad')}${o('own','✏️','ob2_b','ob2_bd')}</div>
      <div class="nav"><button class="btn" data-ob="back">${t('ob_back')}</button><button class="btn go" data-ob="next">${t('ob_next')}</button></div>`;
  }else{
    h=`${st}<div class="hero">🚀</div><h3>${t('ob3_t',{n:esc(ob.name.trim())})}</h3><p>${t('ob3_p')}</p>
      <ul class="tips"><li>${t('ob3_1')}</li><li>${t('ob3_2')}</li><li>${t('ob3_3')}</li><li>${t('ob3_4')}</li></ul>
      <div class="nav"><button class="btn" data-ob="back">${t('ob_back')}</button>
        <button class="btn go" data-ob="finish">${ob.mode==='own'?t('ob3_edit'):t('ob3_go')}</button></div>
      <div style="margin-top:10px"><button class="linky" data-ob="help">${t('ob3_help')}</button></div>`;
  }
  $('#obBody').innerHTML=h+`<div class="pdots">${dots}</div>`;
  const inp=$('#obName'); if(inp) setTimeout(()=>{ try{ inp.focus(); }catch(e){} },50);
}
function finishOb(){
  const p=P(), rt=activeRoutine(p);
  p.name=ob.name.trim()||p.name;
  if(ob.mode==='own'){
    rt.k=undefined; rt.name=t('r_def',{n:1});
    rt.acts=[{id:uid(),icon:'⭐',name:t('ob_myAct'),min:10,color:'#6C8CFF',items:'',link:''}];
  }
  p.checks={date:dayStr(),done:[]};
  S.setup=true; save(); resetClock(); lastIdx=-2;
  $('#obOv').classList.remove('show');
  applyStatic(); renderAll(); renderButtons(); tick(true);
  if(ob.mode==='own') openSettings();
}
$('#obBody').addEventListener('input',e=>{
  if(e.target.id==='obName'){ ob.name=e.target.value; const b=$('#obNext'); if(b) b.disabled=!ob.name.trim(); }
});
$('#obBody').addEventListener('keydown',e=>{
  if(e.target.id==='obName' && e.key==='Enter' && ob.name.trim()){ ob.step=2; drawOb(); }
});
$('#obBody').addEventListener('click',e=>{
  const l=e.target.closest('[data-lang]'); if(l){ setLang(l.dataset.lang); return; }
  const b=e.target.closest('[data-ob]'); if(!b) return;
  const a=b.dataset.ob;
  if(a==='next'){ if(ob.step===1 && !ob.name.trim()) return; ob.step=Math.min(3,ob.step+1); drawOb(); }
  else if(a==='back'){ ob.step=Math.max(1,ob.step-1); drawOb(); }
  else if(a==='mode'){ ob.mode=b.dataset.m; drawOb(); }
  else if(a==='help'){ openHelp(); }
  else if(a==='finish'){ finishOb(); }
});
function openOb(){ ob.step=1; ob.name=''; ob.mode='base'; drawOb(); $('#obOv').classList.add('show'); }

/* ---------- inicio ---------- */
rollDay(); save(); applyStatic(); renderAll(); tick();
// con un solo perfil y una sola rutina no hace falta preguntar "¿quién?"
/* ---------- sin internet: guarda la app en el dispositivo ---------- */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',()=>{ navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{}); });
}

if(!S.setup) openOb();
else if(!(S.profiles.length===1 && S.profiles[0].routines.length===1)) openUsers();
})();
</script>
